name: Ruff Autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    name: Apply safe Ruff fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Apply safe lint fixes
        run: ruff check --fix .
      - name: Format Python files
        run: ruff format .
      - name: Verify remaining lint findings
        run: ruff check .
      - name: Verify formatting
        run: ruff format --check .
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No formatting or safe lint changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff formatting and safe fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
