name: Temporary stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: add temporary stale branch cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Delete stale branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in             feat/recursive-metadata-sync             feat/termux-deb-package             fix/jbmm-metadata-and-release-boundaries             fix/release-build-config-discovery
          do
            git push origin --delete "$branch"
          done
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/temporary-stale-branch-cleanup.yml
          git commit -m "chore: remove temporary stale branch cleanup workflow"
          git push origin HEAD:main
