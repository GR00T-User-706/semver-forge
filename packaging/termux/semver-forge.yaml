# Termux package manifest for SemVer Forge.
# Build with: ./packaging/termux/build.sh
# The build script overrides this fallback with the canonical VERSION file.

control:
  Package: semver-forge
  Version: 1.6.0
  Architecture: all
  Maintainer: GR00T-User-706
  Depends:
  - python
  - git
  Section: devel
  Priority: optional
  Homepage: https://github.com/GR00T-User-706/semver-forge
  Description: Semantic version tracking and metadata synchronization 
    Local-first Semantic Versioning 2.0.0 tooling with version discovery, 
    recursive metadata synchronization, and Conventional Commit analysis.

installation_prefix: /data/data/com.termux/files/usr
deb_dir: dist/termux
tar_compression: xz

data_files:
  bin/svf:
    source: packaging/termux/svf
    perm: '755'


  lib/semver-forge/semver_forge:
    source: src/semver_forge
    source_recurse: true

  share/man/man1/svf.1:
    source: man/svf.1

  share/man/man5/svf-config.5:
    source: man/svf-config.5

