# Generated by SemVer Forge from existing project metadata.
# Review the discovery report before changing version and synchronization settings.
[project]
name = "semver-forge"
description = "Automatic semantic version tracking and metadata synchronization."

[version]
initial = "1.0.0"
source = { type = "toml", file = "pyproject.toml", key = "project.version" }

[git]
tag_prefix = "v"
baseline = "7bf4ab493598a041f75904d87ef9b88550dbf41e"
require_clean = true
unknown_commit = "ignore"
merge_commits = "ignore"

[commits]
breaking_changes = true
ignored_types = ["docs", "style", "refactor", "test", "build", "ci", "chore"]
unknown = "ignore"

[commits.types]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[sync]
targets = [{ type = "text", file = "VERSION" }]

