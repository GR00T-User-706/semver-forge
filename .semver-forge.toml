# Generated by SemVer Forge from existing project metadata.
# Review the discovery report before changing release policy.
[project]
name = "semver-forge"
description = "Automatic semantic version tracking and metadata synchronization."

[version]
initial = "0.3.1"
source = { type = "toml", file = "pyproject.toml", key = "project.version" }

[git]
tag_prefix = "v"
require_clean = true
unknown_commit = "ignore"
merge_commits = "ignore"

[commits]
breaking_changes = true
ignored_types = ["docs", "style", "refactor", "test", "build", "ci", "chore"]
unknown = "ignore"

[commits.types]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[sync]
targets = [{ type = "text", file = "VERSION" }]

[release]
commit_version = true
annotated_tag = true
notes_file = "CHANGELOG.md"
require_confirmation = true
release_when_no_changes = false
